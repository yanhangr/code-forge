<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Forge Runtime 验证台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #68737d;
      --line: #d8dee4;
      --blue: #1769aa;
      --green: #1c7c54;
      --red: #b42318;
      --amber: #9a6700;
      --shadow: 0 8px 24px rgba(23, 33, 43, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover { border-color: #aeb8c2; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.primary:hover { background: #125687; }
    button.danger { color: var(--red); border-color: #e8b9b5; }
    button.danger:hover { border-color: var(--red); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }
    textarea { min-height: 132px; resize: vertical; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    header h1 { margin: 0; font-size: 18px; }
    header .grow { flex: 1; }
    header input { width: min(340px, 40vw); }

    .layout {
      display: grid;
      grid-template-columns: 260px minmax(420px, 1fr) 360px;
      gap: 14px;
      padding: 14px;
      height: calc(100vh - 62px);
    }
    .panel {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .panel-header h2 { margin: 0; font-size: 14px; }
    .panel-body { padding: 12px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }

    .config {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .config label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .config span { color: var(--muted); font-size: 12px; }
    .config .check { flex-direction: row; align-items: center; padding-top: 20px; }
    .config .check input { width: auto; }

    .main {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      min-height: 0;
    }
    .session-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .status-line {
      min-width: 0;
      flex: 1;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-title-input {
      min-width: 180px;
      flex: 1;
      border-color: transparent;
      background: transparent;
      font-weight: 650;
    }
    .session-title-input:focus {
      border-color: var(--blue);
      background: #fff;
    }
    .messages {
      min-height: 0;
      overflow: auto;
      padding: 16px;
      background: #f8fafb;
    }
    .message {
      max-width: min(760px, 92%);
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #fff;
    }
    .message.user {
      margin-left: auto;
      background: #e9f3fb;
      border-color: #bdd8ec;
    }
    .message.pending { border-style: dashed; color: var(--muted); }
    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .composer textarea { min-height: 92px; }

    .reply {
      display: none;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #e4c56a;
      background: #fff8df;
    }
    .reply.active { display: grid; grid-template-columns: 1fr auto; }
    .reply textarea { min-height: 64px; }
    .reply-prompt { grid-column: 1 / -1; color: #6a4b00; }

    .session-item, .event, .file {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fff;
    }
    .session-item { display: grid; gap: 4px; cursor: pointer; text-align: left; }
    .session-item.active { border-color: var(--blue); box-shadow: inset 3px 0 0 var(--blue); }
    .session-item .meta, .file .meta { color: var(--muted); font-size: 12px; }
    .event .type { font-weight: 650; color: var(--blue); }
    .event pre {
      margin: 4px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #3c4854;
      font-size: 12px;
    }
    .trace {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: min(760px, 92%);
      margin: 0 0 12px;
    }
    .trace:empty { display: none; }
    .trace-item {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-left: 3px solid #c3ccd5;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
    }
    .trace-item.running { border-left-color: var(--blue); }
    .trace-item.ok { border-left-color: var(--green); }
    .trace-item.err { border-left-color: var(--red); }
    .trace-item.skill { background: #f3f7fb; }
    .trace-head {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .trace-kind {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .trace-name { font-weight: 650; }
    .trace-summary { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .trace-item pre {
      margin: 6px 0 0;
      padding: 6px 8px;
      border-radius: 4px;
      background: #f4f6f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      max-height: 260px;
      overflow: auto;
    }
    .trace-item pre.trace-code { background: #f0f4f8; }
    .trace-item pre.trace-stderr { background: #fdf0ef; color: #7a271a; }
    .trace-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      padding: 4px 8px;
      border: 1px solid #cfe0ee;
      border-radius: 999px;
      background: #eef6fc;
      color: #255d86;
      font-size: 12px;
    }
    .trace-chip.workspace {
      border-color: #d6e5d9;
      background: #eef7f0;
      color: var(--green);
    }
    .empty { color: var(--muted); padding: 12px; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      background: #eef1f4;
      color: #4c5864;
      font-size: 12px;
    }
    .badge.ok { background: #e4f4eb; color: var(--green); }
    .badge.err { background: #fdecea; color: var(--red); }
    .badge.wait { background: #fff4d6; color: var(--amber); }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 220px 1fr; height: auto; }
      .right { grid-column: 1 / -1; min-height: 420px; }
      .config { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
    }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; }
      header input { width: 100%; }
      .layout { grid-template-columns: 1fr; padding: 8px; }
      .config { grid-template-columns: 1fr; }
      .left { min-height: 240px; }
      .main { min-height: 720px; }
      .composer, .reply.active { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Code Forge Runtime</h1>
    <span id="health" class="badge">未连接</span>
    <div class="grow"></div>
    <label for="runtime-url">Runtime URL</label>
    <input id="runtime-url" value="http://127.0.0.1:8000">
    <button id="refresh-health" type="button">检查</button>
  </header>

  <section class="config">
    <label><span>Storage Root</span><input id="storage-root" value="/tmp/code-forge-nas"></label>
    <label><span>User Rel Path</span><input id="user-rel-path" value="T001/users/U001"></label>
    <label><span>Project Ref</span><input id="project-ref" value="P001"></label>
    <label><span>Project Rel Path</span><input id="project-rel-path" placeholder="可选"></label>
    <label><span>Skill Paths</span><input id="skill-paths" placeholder="逗号分隔；留空为默认根"></label>
    <label class="check"><input id="disable-skills" type="checkbox"> 不使用 Skill</label>
  </section>

  <main class="layout">
    <aside class="panel left">
      <div class="panel-header">
        <h2>历史会话</h2>
        <div class="grow" style="flex:1"></div>
        <button id="refresh-sessions" type="button">刷新</button>
      </div>
      <div id="session-list" class="panel-body stack"><div class="empty">尚未加载</div></div>
    </aside>

    <section class="panel main">
      <div class="session-bar">
        <button id="create-session" class="primary" type="button">新建会话</button>
        <input id="session-title" class="session-title-input" placeholder="未选择会话" disabled>
        <button id="rename-session" type="button" disabled>保存名称</button>
        <button id="cancel-message" class="danger" type="button" disabled>终止</button>
      </div>
      <div id="reply-panel" class="reply">
        <div id="reply-prompt" class="reply-prompt"></div>
        <textarea id="reply-input" placeholder="补充当前 Message 所需信息"></textarea>
        <button id="reply-button" class="primary" type="button">回复</button>
      </div>
      <div id="messages" class="messages"><div class="empty">选择会话后显示消息</div></div>
      <div class="composer">
        <textarea id="message-input" placeholder="输入任务；代码可使用 python 或 bash 围栏"></textarea>
        <button id="send-message" class="primary" type="button">发送</button>
      </div>
    </section>

    <aside class="panel right">
      <div class="panel-header">
        <h2>事件与文件</h2>
        <div style="flex:1"></div>
        <span id="message-status" class="badge">无 Message</span>
      </div>
      <div class="panel-body stack">
        <div id="event-list" class="stack"><div class="empty">等待事件</div></div>
        <button id="refresh-files" type="button">刷新文件</button>
        <div id="file-list" class="stack"><div class="empty">尚无文件</div></div>
      </div>
    </aside>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const EVENT_TYPES = [
      "message.accepted", "message.started", "message.waiting", "message.resumed",
      "message.recovering", "message.cancel_requested", "message.finished",
      "message.delta", "message.completed",
      "tool.prepared", "tool.started", "tool.output", "tool.finished", "tool.unknown",
      "skill.activated", "skill.started", "skill.finished", "workspace.committed"
    ];
    const TRACE_EVENT_TYPES = new Set([
      "tool.prepared", "tool.started", "tool.output", "tool.finished", "tool.unknown",
      "skill.activated", "skill.started", "skill.finished", "workspace.committed"
    ]);
    let currentSession = null;
    let currentMessageId = null;
    let currentPending = null;
    let eventCursor = 0;
    let reconnectSource = null;
    let sending = false;
    const toolCards = new Map();
    const skillCards = new Map();

    function baseUrl() {
      return $("runtime-url").value.trim().replace(/\/$/, "");
    }

    function setBadge(element, text, mode = "") {
      element.textContent = text;
      element.className = `badge ${mode}`.trim();
    }

    function sessionConfig() {
      const config = {
        storage_root: $("storage-root").value.trim(),
        user_rel_path: $("user-rel-path").value.trim(),
        project_ref: $("project-ref").value.trim() || null,
        project_rel_path: $("project-rel-path").value.trim() || null
      };
      if (!config.storage_root || !config.user_rel_path) {
        throw new Error("storage_root 和 user_rel_path 必填");
      }
      return config;
    }

    function selectedSkillPaths() {
      if ($("disable-skills").checked) return [];
      const value = $("skill-paths").value.trim();
      if (!value) return null;
      return value.split(",").map((item) => item.trim()).filter(Boolean);
    }

    async function api(path, options = {}) {
      const response = await fetch(baseUrl() + path, options);
      const text = await response.text();
      let payload = {};
      if (text) payload = JSON.parse(text);
      if (!response.ok || payload.code !== "0000") {
        throw new Error(payload.message || `HTTP ${response.status}`);
      }
      return payload.data;
    }

    async function refreshHealth() {
      try {
        const health = await api("/health");
        setBadge($("health"), `Runtime ${health.status}`, health.status === "ok" ? "ok" : "err");
      } catch (error) {
        setBadge($("health"), "Runtime 不可达", "err");
      }
    }

    async function createSession() {
      try {
        const session = await api("/v1/create-session", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(sessionConfig())
        });
        await selectSession(session.session_id);
        await loadSessions();
      } catch (error) {
        setBadge($("message-status"), error.message, "err");
      }
    }

    async function renameSession() {
      if (!currentSession) return;
      const title = $("session-title").value.trim();
      if (!title) {
        setBadge($("message-status"), "会话名称不能为空", "err");
        return;
      }
      try {
        const session = await api("/v1/update-session", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({session_id: currentSession.session_id, title})
        });
        currentSession = session;
        $("session-title").value = session.title;
        await loadSessions();
      } catch (error) {
        setBadge($("message-status"), error.message, "err");
      }
    }

    async function loadSessions() {
      const container = $("session-list");
      try {
        const params = new URLSearchParams({limit: "100"});
        const userRelPath = $("user-rel-path").value.trim();
        if (userRelPath) params.set("user_rel_path", userRelPath);
        const page = await api(`/v1/list-sessions?${params.toString()}`);
        container.textContent = "";
        if (!page.items.length) {
          container.innerHTML = '<div class="empty">暂无会话</div>';
          return;
        }
        for (const session of page.items) {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "session-item";
          if (currentSession?.session_id === session.session_id) item.classList.add("active");
          const title = document.createElement("strong");
          title.textContent = session.title || "未命名会话";
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = `${session.user_rel_path} · ${session.project_rel_path}`;
          item.append(title, meta);
          item.addEventListener("click", () => selectSession(session.session_id));
          container.append(item);
        }
      } catch (error) {
        container.textContent = "";
        const node = document.createElement("div");
        node.className = "empty";
        node.textContent = error.message;
        container.append(node);
      }
    }

    async function selectSession(sessionId) {
      try {
        const session = await api(`/v1/get-session?session_id=${encodeURIComponent(sessionId)}`);
        currentSession = session;
        currentMessageId = null;
        currentPending = null;
        eventCursor = 0;
        toolCards.clear();
        skillCards.clear();
        $("cancel-message").disabled = true;
        $("session-title").value = session.title;
        $("session-title").disabled = false;
        $("rename-session").disabled = false;
        $("messages").textContent = "";
        $("event-list").innerHTML = '<div class="empty">等待事件</div>';
        hideReply();
        await loadMessages();
        await refreshSessionState();
        await listFiles();
        await loadSessions();
      } catch (error) {
        setBadge($("message-status"), error.message, "err");
      }
    }

    async function loadMessages() {
      if (!currentSession) return;
      const container = $("messages");
      container.textContent = "";
      const page = await api(
        `/v1/list-session-messages?session_id=${encodeURIComponent(currentSession.session_id)}&limit=100`
      );
      for (const message of page.items) {
        appendMessage("user", message.input, `user-${message.message_id}`);
        traceContainerFor(message.message_id);
        if (message.output) appendMessage("assistant", message.output, message.message_id);
        currentMessageId = message.message_id;
      }
      await loadSessionTrace();
    }

    function appendMessage(role, text, key) {
      const container = $("messages");
      if (container.querySelector(".empty")) container.textContent = "";
      let item = key ? container.querySelector(`[data-message="${CSS.escape(key)}"]`) : null;
      if (!item) {
        item = document.createElement("div");
        item.className = `message ${role}`;
        if (key) item.dataset.message = key;
        container.append(item);
      }
      if (text) item.textContent = text;
      container.scrollTop = container.scrollHeight;
      return item;
    }

    const typingStates = new Map();

    function appendDelta(messageId, text) {
      let state = typingStates.get(messageId);
      if (!state) {
        state = {
          item: appendMessage("assistant", "", messageId),
          queue: "",
          finalText: null,
          running: false,
        };
        typingStates.set(messageId, state);
      }
      state.queue += text;
      state.item.classList.add("pending");
      if (!state.running) typeNextCharacter(messageId);
    }

    function completeMessage(messageId, text) {
      let state = typingStates.get(messageId);
      if (!state) {
        const item = appendMessage("assistant", text, messageId);
        item.classList.remove("pending");
        return;
      }
      state.finalText = text;
      if (!state.running) {
        state.item.textContent = text;
        state.item.classList.remove("pending");
        typingStates.delete(messageId);
      }
    }

    function typeNextCharacter(messageId) {
      const state = typingStates.get(messageId);
      if (!state) return;
      if (!state.queue.length) {
        state.running = false;
        if (state.finalText !== null) {
          state.item.textContent = state.finalText;
          state.item.classList.remove("pending");
          typingStates.delete(messageId);
        }
        return;
      }
      state.running = true;
      const character = state.queue[0];
      state.queue = state.queue.slice(1);
      state.item.textContent += character;
      const container = $("messages");
      container.scrollTop = container.scrollHeight;
      setTimeout(() => typeNextCharacter(messageId), 18);
    }

    function appendEvent(payload) {
      const event = payload.data;
      const container = $("event-list");
      if (container.querySelector(".empty")) container.textContent = "";
      const item = document.createElement("div");
      item.className = "event";
      const type = document.createElement("div");
      type.className = "type";
      type.textContent = event.type;
      const body = document.createElement("pre");
      body.textContent = JSON.stringify(event.data);
      item.append(type, body);
      container.prepend(item);
      eventCursor = Math.max(eventCursor, event.seq);
    }

    function traceContainerFor(messageId) {
      const container = $("messages");
      if (container.querySelector(".empty")) container.textContent = "";
      const key = CSS.escape(messageId);
      let trace = container.querySelector(`[data-trace="${key}"]`);
      if (!trace) {
        trace = document.createElement("div");
        trace.className = "trace";
        trace.dataset.trace = messageId;
        const assistant = container.querySelector(`[data-message="${key}"]`);
        if (assistant) container.insertBefore(trace, assistant);
        else container.append(trace);
      }
      container.scrollTop = container.scrollHeight;
      return trace;
    }

    function toolStatusMode(status) {
      if (status === "SUCCEEDED") return "ok";
      if (["FAILED", "CANCELLED", "UNKNOWN"].includes(status)) return "err";
      if (status === "PREPARED") return "wait";
      return "";
    }

    function upsertToolCard(event) {
      const data = event.data || {};
      const operationId = data.operation_id;
      if (!operationId) return null;
      let state = toolCards.get(operationId);
      if (!state) {
        const trace = traceContainerFor(event.message_id);
        const item = document.createElement("div");
        item.className = "trace-item tool";
        const head = document.createElement("div");
        head.className = "trace-head";
        const kind = document.createElement("span");
        kind.className = "trace-kind";
        kind.textContent = "工具执行";
        const name = document.createElement("span");
        name.className = "trace-name";
        name.textContent = data.tool_ref || "tool";
        const status = document.createElement("span");
        status.className = "badge";
        head.append(kind, name, status);
        const summary = document.createElement("div");
        summary.className = "trace-summary";
        const code = document.createElement("pre");
        code.className = "trace-code";
        code.hidden = true;
        const stdout = document.createElement("pre");
        stdout.className = "trace-stdout";
        stdout.hidden = true;
        const stderr = document.createElement("pre");
        stderr.className = "trace-stderr";
        stderr.hidden = true;
        item.append(head, summary, code, stdout, stderr);
        trace.append(item);
        state = {item, status, summary, code, stdout, stderr};
        toolCards.set(operationId, state);
      }
      if (data.tool_ref) state.item.querySelector(".trace-name").textContent = data.tool_ref;
      if (data.input_summary) state.summary.textContent = data.input_summary;
      return state;
    }

    function addSkillChip(event) {
      const data = event.data || {};
      const trace = traceContainerFor(event.message_id);
      const chip = document.createElement("div");
      chip.className = "trace-chip";
      chip.textContent = `已加载 Skill ${data.name || ""}@${data.version || ""}`;
      trace.append(chip);
    }

    function updateSkillCard(event) {
      const data = event.data || {};
      const key = `skill:${data.operation_id || data.name}`;
      let state = skillCards.get(key);
      if (!state) {
        const trace = traceContainerFor(event.message_id);
        const item = document.createElement("div");
        item.className = "trace-item skill running";
        const head = document.createElement("div");
        head.className = "trace-head";
        const kind = document.createElement("span");
        kind.className = "trace-kind";
        kind.textContent = "Skill 执行";
        const name = document.createElement("span");
        name.className = "trace-name";
        name.textContent = `${data.name || ""}@${data.version || ""}`;
        const status = document.createElement("span");
        status.className = "badge wait";
        status.textContent = "RUNNING";
        head.append(kind, name, status);
        item.append(head);
        trace.append(item);
        state = {item, status};
        skillCards.set(key, state);
      }
      if (event.type === "skill.finished") {
        const status = data.status || "FAILED";
        const mode = toolStatusMode(status);
        setBadge(state.status, status, mode);
        state.item.className = `trace-item skill ${mode === "ok" ? "ok" : "err"}`;
      }
    }

    function addWorkspaceChip(event) {
      const data = event.data || {};
      const trace = traceContainerFor(event.message_id);
      const chip = document.createElement("div");
      chip.className = "trace-chip workspace";
      const paths = Array.isArray(data.changed_paths) ? data.changed_paths : [];
      const suffix = paths.length ? ` · ${paths.join(", ")}` : "";
      chip.textContent = `文件修订 ${data.revision_id || ""}${suffix}`;
      trace.append(chip);
    }

    function appendToolOutput(event) {
      const state = upsertToolCard(event);
      if (!state) return;
      const data = event.data || {};
      const target = data.stream === "stderr" ? state.stderr : state.stdout;
      target.hidden = false;
      target.textContent += data.text || "";
      const container = $("messages");
      container.scrollTop = container.scrollHeight;
    }

    function finishToolCard(event) {
      const state = upsertToolCard(event);
      if (!state) return;
      const data = event.data || {};
      const status = event.type === "tool.unknown" ? "UNKNOWN" : data.status || "FAILED";
      const mode = toolStatusMode(status);
      setBadge(state.status, status, mode);
      state.item.className = `trace-item tool ${mode}`.trim();
      if (data.error && data.error.message && !state.stderr.textContent) {
        state.stderr.hidden = false;
        state.stderr.textContent = data.error.message;
      }
      refreshToolCard(data.operation_id, true);
    }

    function handleTraceEvent(event) {
      if (event.type === "skill.activated") {
        addSkillChip(event);
      } else if (event.type === "skill.started" || event.type === "skill.finished") {
        updateSkillCard(event);
      } else if (event.type === "tool.prepared") {
        const state = upsertToolCard(event);
        if (state) setBadge(state.status, "PREPARED", "wait");
      } else if (event.type === "tool.started") {
        const state = upsertToolCard(event);
        if (state) {
          setBadge(state.status, "RUNNING", "");
          state.item.className = "trace-item tool running";
          refreshToolCard(event.data.operation_id, false);
        }
      } else if (event.type === "tool.output") {
        appendToolOutput(event);
      } else if (event.type === "tool.finished" || event.type === "tool.unknown") {
        finishToolCard(event);
      } else if (event.type === "workspace.committed") {
        addWorkspaceChip(event);
      }
    }

    async function refreshToolCard(operationId, includeLogs) {
      if (!currentSession || !operationId) return;
      let detail;
      try {
        detail = await api(
          `/v1/get-tool-execution?session_id=${encodeURIComponent(currentSession.session_id)}&operation_id=${encodeURIComponent(operationId)}`
        );
      } catch (error) {
        return;
      }
      const state = toolCards.get(operationId);
      if (!state) return;
      if (detail.input) {
        state.code.hidden = false;
        state.code.textContent = detail.input;
      }
      if (includeLogs) {
        if (detail.stdout) {
          state.stdout.hidden = false;
          state.stdout.textContent = detail.stdout;
        }
        if (detail.stderr) {
          state.stderr.hidden = false;
          state.stderr.textContent = detail.stderr;
        }
      }
      if (detail.status) setBadge(state.status, detail.status, toolStatusMode(detail.status));
    }

    async function loadSessionTrace() {
      if (!currentSession) return;
      let page;
      try {
        page = await api(
          `/v1/list-session-events?session_id=${encodeURIComponent(currentSession.session_id)}&after_seq=0&limit=1000`
        );
      } catch (error) {
        return;
      }
      for (const event of page.items) {
        if (TRACE_EVENT_TYPES.has(event.type)) handleTraceEvent(event);
      }
      await Promise.all(
        [...toolCards.keys()].map((operationId) => refreshToolCard(operationId, true))
      );
      for (const trace of document.querySelectorAll(".trace")) {
        if (!trace.childElementCount) trace.remove();
      }
    }

    function showReply(pending) {
      currentPending = pending;
      if (!pending) {
        hideReply();
        return;
      }
      $("reply-prompt").textContent = pending.prompt || "当前 Message 需要补充信息";
      $("reply-panel").classList.add("active");
    }

    function hideReply() {
      currentPending = null;
      $("reply-panel").classList.remove("active");
      $("reply-input").value = "";
    }

    async function refreshSessionState() {
      if (!currentSession) return;
      const state = await api(
        `/v1/get-session-state?session_id=${encodeURIComponent(currentSession.session_id)}`
      );
      currentSession = state.session;
      $("session-title").value = state.session.title;
      currentPending = state.pending_reply;
      eventCursor = Number(state.event_cursor.split(":").pop()) || 0;
      if (state.current_message) {
        currentMessageId = state.current_message.message_id;
        setBadge($("message-status"), state.current_message.status, statusMode(state.current_message.status));
        $("cancel-message").disabled = !canRequestCancel(state.current_message.status);
      } else {
        setBadge($("message-status"), "无 Message");
        $("cancel-message").disabled = true;
      }
      showReply(state.pending_reply);
      if (
        state.current_message &&
        !["SUCCEEDED", "FAILED", "TIMED_OUT"].includes(state.current_message.status)
      ) {
        connectReplay();
      }
    }

    function statusMode(status) {
      if (status === "SUCCEEDED") return "ok";
      if (["FAILED", "CANCELLED", "TIMED_OUT"].includes(status)) return "err";
      if (["WAITING_USER", "WAITING_EXTERNAL", "RECOVERING", "CANCELLING"].includes(status)) {
        return "wait";
      }
      return "";
    }

    function canRequestCancel(status) {
      return Boolean(
        status &&
        !["CANCELLING", "SUCCEEDED", "FAILED", "CANCELLED", "TIMED_OUT"].includes(status)
      );
    }

    function connectReplay() {
      if (!currentSession) return;
      if (reconnectSource) reconnectSource.close();
      const url = `${baseUrl()}/v1/stream-session-events?session_id=${encodeURIComponent(currentSession.session_id)}&after_seq=${eventCursor}`;
      const source = new EventSource(url);
      reconnectSource = source;
      for (const type of EVENT_TYPES) {
        source.addEventListener(type, (event) => processEvent(JSON.parse(event.data)));
      }
      source.onerror = () => {
        if (source.readyState === EventSource.CLOSED) reconnectSource = null;
      };
    }

    function processEvent(payload) {
      const event = payload.data;
      appendEvent(payload);
      if (TRACE_EVENT_TYPES.has(event.type)) handleTraceEvent(event);
      if (event.type === "message.accepted" || event.type === "message.started") {
        currentMessageId = event.message_id;
        setBadge($("message-status"), event.data.status, statusMode(event.data.status));
        $("cancel-message").disabled = !canRequestCancel(event.data.status);
      } else if (event.type === "message.delta") {
        appendDelta(event.message_id, event.data.text || "");
      } else if (event.type === "message.completed") {
        completeMessage(event.message_id, event.data.text || "");
      } else if (event.type === "message.waiting") {
        setBadge($("message-status"), event.data.status, "wait");
        showReply(event.data.pending_reply);
        $("cancel-message").disabled = !canRequestCancel(event.data.status);
      } else if (event.type === "message.recovering") {
        currentMessageId = event.message_id;
        setBadge($("message-status"), "RECOVERING", "wait");
        $("cancel-message").disabled = false;
      } else if (event.type === "message.cancel_requested") {
        currentMessageId = event.message_id;
        setBadge($("message-status"), event.data.status, "wait");
        $("cancel-message").disabled = true;
      } else if (event.type === "message.resumed") {
        hideReply();
        setBadge($("message-status"), event.data.status, "");
        $("cancel-message").disabled = false;
      } else if (event.type === "message.finished") {
        setBadge($("message-status"), event.data.status, statusMode(event.data.status));
        currentMessageId = event.message_id;
        $("cancel-message").disabled = true;
        hideReply();
        if (reconnectSource) {
          reconnectSource.close();
          reconnectSource = null;
        }
        refreshSessionState().catch(() => {});
        listFiles().catch(() => {});
      }
    }

    async function readSseResponse(response) {
      if (!response.ok) {
        const payload = await response.json();
        throw new Error(payload.message || `HTTP ${response.status}`);
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const {value, done} = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
        let boundary = buffer.indexOf("\n\n");
        while (boundary >= 0) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const dataLine = block.split("\n").find((line) => line.startsWith("data: "));
          if (dataLine) processEvent(JSON.parse(dataLine.slice(6)));
          boundary = buffer.indexOf("\n\n");
        }
        if (done) break;
      }
    }

    async function sendMessage() {
      if (!currentSession || sending) return;
      const input = $("message-input").value;
      if (!input.trim()) return;
      sending = true;
      $("send-message").disabled = true;
      appendMessage("user", input, `pending-user-${Date.now()}`);
      $("message-input").value = "";
      try {
        const response = await fetch(`${baseUrl()}/v1/send-message`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            session_id: currentSession.session_id,
            input,
            skill_paths: selectedSkillPaths()
          })
        });
        await readSseResponse(response);
      } catch (error) {
        setBadge($("message-status"), error.message, "err");
      } finally {
        sending = false;
        $("send-message").disabled = false;
      }
    }

    async function reply() {
      if (!currentSession || !currentMessageId || !currentPending) return;
      const text = $("reply-input").value;
      if (!text.trim()) return;
      try {
        const response = await fetch(`${baseUrl()}/v1/reply`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            message_id: currentMessageId,
            pending_id: currentPending.pending_id,
            text
          })
        });
        hideReply();
        await readSseResponse(response);
      } catch (error) {
        setBadge($("message-status"), error.message, "err");
      }
    }

    async function cancelMessage() {
      if (!currentSession || !currentMessageId) return;
      $("cancel-message").disabled = true;
      try {
        const message = await api("/v1/cancel-message", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message_id: currentMessageId})
        });
        currentMessageId = message.message_id;
        setBadge($("message-status"), message.status, statusMode(message.status));
        $("cancel-message").disabled = !canRequestCancel(message.status);
      } catch (error) {
        setBadge($("message-status"), error.message, "err");
      }
    }

    async function listFiles() {
      if (!currentSession) return;
      const page = await api(
        `/v1/list-session-files?session_id=${encodeURIComponent(currentSession.session_id)}`
      );
      const container = $("file-list");
      container.textContent = "";
      if (!page.items.length) {
        container.innerHTML = '<div class="empty">尚无文件</div>';
        return;
      }
      for (const file of page.items) {
        const item = document.createElement("div");
        item.className = "file";
        const name = document.createElement("div");
        name.textContent = file.path;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${file.size_bytes} B · ${file.digest.slice(0, 19)}`;
        item.append(name, meta);
        item.title = "双击读取文本";
        item.addEventListener("dblclick", () => readFile(file.path));
        container.append(item);
      }
    }

    async function readFile(path) {
      if (!currentSession) return;
      try {
        const file = await api(
          `/v1/read-session-file?session_id=${encodeURIComponent(currentSession.session_id)}&path=${encodeURIComponent(path)}`
        );
        appendMessage("assistant", file.content, `file-${path}-${Date.now()}`);
      } catch (error) {
        setBadge($("message-status"), error.message, "err");
      }
    }

    $("refresh-health").addEventListener("click", refreshHealth);
    $("refresh-sessions").addEventListener("click", loadSessions);
    $("create-session").addEventListener("click", createSession);
    $("rename-session").addEventListener("click", renameSession);
    $("send-message").addEventListener("click", sendMessage);
    $("cancel-message").addEventListener("click", cancelMessage);
    $("reply-button").addEventListener("click", reply);
    $("refresh-files").addEventListener("click", listFiles);
    $("user-rel-path").addEventListener("change", loadSessions);
    $("session-title").addEventListener("keydown", (event) => {
      if (event.key === "Enter") renameSession();
    });
    $("message-input").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) sendMessage();
    });

    refreshHealth();
    loadSessions();
  </script>
</body>
</html>
