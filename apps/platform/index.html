<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Forge 验证台</title>
  <style>
    :root {
      color-scheme: light;
      --border: #d8dee7;
      --text: #1f2937;
      --muted: #64748b;
      --panel: #f8fafc;
      --accent: #2563eb;
      --danger: #b91c1c;
      --success: #15803d;
      background: #f4f7fb;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: calc(100% - 24px);
      max-width: none;
      margin: 0 auto;
      padding: 16px 0 40px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .runtime-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 330px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 10px;
      color: var(--text);
      background: white;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 11px;
      background: white;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: #94a3b8; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    button.danger { color: var(--danger); }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 0.8fr) minmax(420px, 1.4fr);
      gap: 16px;
    }

    .grid.three {
      grid-template-columns: minmax(240px, 0.9fr) minmax(360px, 1.1fr) minmax(560px, 1.8fr);
      gap: 12px;
    }

    section {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    section h2 {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 1.3;
    }

    .label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .skill {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      background: var(--panel);
      font-size: 12px;
    }

    .status {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      background: white;
    }

    .badge.success { color: var(--success); }
    .badge.danger { color: var(--danger); }

    .log {
      max-height: 520px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      background: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .log-entry {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .log-entry:last-child { border-bottom: 0; }
    .log-type { color: var(--muted); }
    .log-data { white-space: pre-wrap; overflow-wrap: anywhere; }

    .file {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
    }

    .file:last-child { border-bottom: 0; }

    .run-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }

    .run-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      user-select: all;
      overflow-wrap: anywhere;
    }

    .session-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    .session-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      max-height: 60vh;
      overflow: auto;
      padding-right: 4px;
    }

    .message-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      background: var(--panel);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.5;
      max-width: 86%;
    }

    .message-item.user {
      align-self: flex-end;
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .message-item.assistant {
      align-self: flex-start;
    }

    @media (max-width: 900px) {
      header { align-items: stretch; flex-direction: column; }
      .runtime-bar { min-width: 0; }
      .grid, .grid.three { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Code Forge 验证台</h1>
        <p class="subtitle">通过公开 HTTP/SSE 契约观察 Agent Runtime；不绕过 Runtime 私有状态。</p>
      </div>
      <div class="runtime-bar">
        <input id="runtime-url" type="text" value="http://127.0.0.1:8000" aria-label="Runtime 地址">
        <button id="refresh-health" type="button">刷新</button>
      </div>
    </header>

    <div class="status">
      <span id="health-status" class="badge">未连接</span>
      <span id="session-status" class="badge">未创建会话</span>
      <span id="run-status" class="badge">无 Run</span>
    </div>

    <div class="grid three">
      <section>
        <h2>历史会话</h2>
        <div id="session-list" class="session-list">尚未加载</div>
      </section>

      <section>
        <h2>会话与输入</h2>
        <div class="row">
          <button id="create-session" class="primary" type="button">创建会话</button>
          <button id="list-files" type="button">查看文件</button>
        </div>
        <div id="session-info" style="margin-top: 12px; font-size: 12px; color: var(--muted)"></div>
        <div id="run-list" style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px"></div>

        <label class="label" for="run-input">任务输入</label>
        <textarea id="run-input" placeholder="例如：\n```python\nprint(sum(i*i for i in range(1, 101)))\n```"></textarea>

        <label class="label">Skill 候选</label>
        <div id="skill-list" class="skills">尚未加载</div>

        <div class="row" style="margin-top: 14px">
          <button id="submit-run" class="primary" type="button">提交 Run</button>
          <button id="cancel-run" class="danger" type="button">取消 Run</button>
        </div>
      </section>

      <section>
        <h2>事件与输出</h2>
        <div id="run-detail" style="margin-bottom: 10px; font-size: 12px; color: var(--muted)"></div>
        <div id="message-list" class="message-list"></div>
        <div id="event-log" class="log">等待事件...</div>
      </section>
    </div>

    <section style="margin-top: 16px">
      <h2>Workspace 文件</h2>
      <div id="file-list" class="file-list">尚无文件</div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const runtimeUrlInput = $("runtime-url");
    let currentSession = null;
    let currentRun = null;
    let currentEventSource = null;
    let lastEventSeq = 0;

    const EVENT_TYPES = [
      "run.accepted", "run.started", "run.waiting", "run.resumed", "run.recovering",
      "run.cancel_requested", "run.finished", "message.delta", "message.completed",
      "tool.prepared", "tool.started", "tool.output", "tool.finished", "tool.unknown",
      "skill.activated", "skill.started", "skill.finished", "workspace.committed"
    ];

    function baseUrl() {
      return runtimeUrlInput.value.replace(/\/$/, "");
    }

    async function api(path, options = {}) {
      const response = await fetch(baseUrl() + path, options);
      const text = await response.text();
      let payload = {};
      if (text) payload = JSON.parse(text);
      if (!response.ok) {
        const message = payload.error?.message || `HTTP ${response.status}`;
        throw new Error(message);
      }
      return payload;
    }

    function setBadge(el, text, kind) {
      el.textContent = text;
      el.classList.remove("success", "danger");
      if (kind) el.classList.add(kind);
    }

    function appendEvent(type, data) {
      const log = $("event-log");
      if (log.dataset.empty === "1") log.textContent = "";
      log.dataset.empty = "0";
      const entry = document.createElement("div");
      entry.className = "log-entry";
      const typeNode = document.createElement("div");
      typeNode.className = "log-type";
      typeNode.textContent = type;
      const dataNode = document.createElement("div");
      dataNode.className = "log-data";
      dataNode.textContent = JSON.stringify(data);
      entry.append(typeNode, dataNode);
      log.append(entry);
      log.scrollTop = log.scrollHeight;
    }

    function clearLog() {
      const log = $("event-log");
      log.textContent = "等待事件...";
      log.dataset.empty = "1";
      lastEventSeq = 0;
    }

    async function refreshHealth() {
      try {
        const health = await api("/health");
        setBadge($("health-status"), `Runtime ${health.status}`, health.status === "ok" ? "success" : "danger");
      } catch (error) {
        setBadge($("health-status"), "Runtime 不可达", "danger");
      }
    }

    async function loadSkills() {
      const container = $("skill-list");
      try {
        const page = await api("/v1/skills");
        if (!page.items.length) {
          container.textContent = "无可用手工 Skill";
          return;
        }
        container.textContent = "";
        for (const skill of page.items) {
          const label = document.createElement("label");
          label.className = "skill";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.value = skill.name;
          input.dataset.version = skill.version;
          label.append(input, `${skill.name}@${skill.version}`);
          container.append(label);
        }
      } catch (error) {
        container.textContent = error.message;
      }
    }

    async function loadSessions() {
      const container = $("session-list");
      try {
        const page = await api("/v1/sessions?limit=100");
        container.textContent = "";
        if (!page.items.length) {
          container.textContent = "暂无历史会话";
          return;
        }
        for (const session of page.items) {
          const row = document.createElement("div");
          row.className = "session-row";
          const select = document.createElement("button");
          select.type = "button";
          select.textContent = session.title || "Session";
          select.addEventListener("click", () => selectSession(session.id));
          const id = document.createElement("code");
          id.className = "run-id";
          id.textContent = session.id;
          const copy = document.createElement("button");
          copy.type = "button";
          copy.textContent = "复制";
          copy.addEventListener("click", async () => {
            await navigator.clipboard.writeText(session.id);
            copy.textContent = "已复制";
            setTimeout(() => (copy.textContent = "复制"), 800);
          });
          row.append(select, id, copy);
          container.append(row);
        }
      } catch (error) {
        container.textContent = error.message;
      }
    }

    async function selectSession(sessionId) {
      try {
        const session = await api(`/v1/sessions/${sessionId}`);
        currentSession = session;
        currentRun = null;
        clearLog();
        clearMessages();
        setBadge($("session-status"), `Session ${session.id.slice(0, 8)}`, "success");
        $("session-info").textContent = `session_id=${session.id} workspace_id=${session.workspace_id}`;
        await loadSkills();
        await loadRuns();
        await listFiles();
      } catch (error) {
        setBadge($("session-status"), error.message, "danger");
      }
    }

    async function createSession() {
      try {
        const key = crypto.randomUUID();
        const session = await api("/v1/sessions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Idempotency-Key": key,
            "X-Forge-Scope": "default"
          },
          body: JSON.stringify({
            title: "本地验证会话",
            context: {scope_id: "default"}
          })
        });
        currentSession = session;
        currentRun = null;
        clearLog();
        setBadge($("session-status"), `Session ${session.id.slice(0, 8)}`, "success");
        $("session-info").textContent = `session_id=${session.id} workspace_id=${session.workspace_id}`;
        $("file-list").textContent = "尚无文件";
        await loadSkills();
        await loadRuns();
        await loadSessions();
      } catch (error) {
        setBadge($("session-status"), error.message, "danger");
      }
    }

    function selectedSkills() {
      return [...document.querySelectorAll("#skill-list input:checked")].map((input) => ({
        name: input.value,
        version: input.dataset.version
      }));
    }

    async function submitRun() {
      if (!currentSession) {
        setBadge($("session-status"), "请先创建会话", "danger");
        return;
      }
      const input = $("run-input").value;
      if (!input.trim()) {
        setBadge($("run-status"), "输入不能为空", "danger");
        return;
      }
      try {
        const accepted = await api(`/v1/sessions/${currentSession.id}/runs`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Idempotency-Key": crypto.randomUUID(),
            "X-Forge-Scope": "default"
          },
          body: JSON.stringify({
            input,
            agent_ref: "general@1",
            skills: selectedSkills(),
            context: {scope_id: "default"}
          })
        });
        currentRun = accepted;
        appendChatMessage("user", input, `user-${accepted.id}`);
        setBadge($("run-status"), `Run ${accepted.id.slice(0, 8)} · ${accepted.status}`, "success");
        $("run-detail").textContent = `run_id=${accepted.id} state_version=${accepted.state_version}`;
        subscribeRun(accepted.id);
        await loadRuns();
      } catch (error) {
        setBadge($("run-status"), error.message, "danger");
      }
    }

    function subscribeRun(runId) {
      if (currentEventSource) currentEventSource.close();
      const url = `${baseUrl()}/v1/runs/${runId}/events?after_seq=${lastEventSeq}`;
      const source = new EventSource(url);
      currentEventSource = source;
      for (const type of EVENT_TYPES) {
        source.addEventListener(type, (event) => {
          const payload = JSON.parse(event.data);
          lastEventSeq = Math.max(lastEventSeq, payload.seq);
          appendEvent(payload.type, payload.data);
          if (payload.type === "message.delta") {
            appendAssistantDelta(payload.data.message_id, payload.data.text);
          }
          if (payload.type === "message.completed") {
            completeAssistantMessage(payload.data.message_id, payload.data.text);
          }
          if (payload.type === "run.finished") {
            setBadge($("run-status"), `Run ${runId.slice(0, 8)} · ${payload.data.status}`, payload.data.status === "SUCCEEDED" ? "success" : "danger");
            source.close();
            refreshRun(runId);
          }
        });
      }
      source.onerror = () => {
        if (source.readyState === EventSource.CLOSED) return;
        setBadge($("run-status"), "事件流断开，等待浏览器重连", "danger");
      };
    }

    async function refreshRun(runId) {
      try {
        const run = await api(`/v1/runs/${runId}`);
        currentRun = run;
        setBadge($("run-status"), `Run ${run.id.slice(0, 8)} · ${run.status}`, run.status === "SUCCEEDED" ? "success" : "danger");
        $("run-detail").textContent = `output=${run.output || ""}`;
        await loadMessages(runId);
        await listFiles();
      } catch (error) {
        setBadge($("run-status"), error.message, "danger");
      }
    }

    async function loadRuns() {
      const container = $("run-list");
      if (!currentSession) {
        container.textContent = "";
        return;
      }
      try {
        const page = await api(`/v1/sessions/${currentSession.id}/runs`);
        container.textContent = "";
        if (!page.items.length) {
          container.textContent = "当前 Session 还没有 Run";
          return;
        }
        for (const run of page.items) {
          const row = document.createElement("div");
          row.className = "run-row";
          const select = document.createElement("button");
          select.type = "button";
          select.textContent = run.status;
          select.addEventListener("click", () => selectRun(run.id));
          const id = document.createElement("code");
          id.className = "run-id";
          id.textContent = run.id;
          const copy = document.createElement("button");
          copy.type = "button";
          copy.textContent = "复制";
          copy.addEventListener("click", async () => {
            await navigator.clipboard.writeText(run.id);
            copy.textContent = "已复制";
            setTimeout(() => (copy.textContent = "复制"), 800);
          });
          row.append(select, id, copy);
          container.append(row);
        }
        await selectRun(page.items[page.items.length - 1].id);
      } catch (error) {
        container.textContent = error.message;
      }
    }

    async function selectRun(runId) {
      currentRun = {id: runId};
      await refreshRun(runId);
      subscribeRun(runId);
    }

    async function cancelRun() {
      if (!currentRun) return;
      try {
        const run = await api(`/v1/runs/${currentRun.id}/cancel`, {
          method: "POST",
          headers: {"X-Forge-Scope": "default"}
        });
        currentRun = run;
        setBadge($("run-status"), `Run ${run.id.slice(0, 8)} · ${run.status}`, "danger");
      } catch (error) {
        setBadge($("run-status"), error.message, "danger");
      }
    }

    function clearMessages() {
      $("message-list").textContent = "";
    }

    function appendChatMessage(role, text, messageId) {
      const container = $("message-list");
      const item = document.createElement("div");
      item.className = `message-item ${role}`;
      item.dataset.messageId = messageId;
      item.textContent = text;
      container.append(item);
      container.scrollTop = container.scrollHeight;
      return item;
    }

    function appendAssistantDelta(messageId, text) {
      let item = document.querySelector(`[data-message-id="${messageId}"]`);
      if (!item) {
        item = appendChatMessage("assistant", "", messageId);
      }
      item.textContent += text;
      const container = $("message-list");
      container.scrollTop = container.scrollHeight;
    }

    function completeAssistantMessage(messageId, text) {
      let item = document.querySelector(`[data-message-id="${messageId}"]`);
      if (!item) {
        item = appendChatMessage("assistant", "", messageId);
      }
      item.textContent = text;
    }

    async function loadMessages(runId) {
      const container = $("message-list");
      container.textContent = "";
      const log = $("event-log");
      log.textContent = "";
      log.dataset.empty = "1";
      lastEventSeq = 0;
      if (!currentSession) return;
      try {
        const runs = await api(`/v1/sessions/${currentSession.id}/runs?limit=100`);
        let focusLastSeq = 0;
        for (const run of runs.items) {
          appendChatMessage("user", run.input, `user-${run.id}`);
          const page = await api(`/v1/runs/${run.id}/event-history?after_seq=0&limit=2000`);
          for (const event of page.items) {
            appendEvent(event.type, event.data);
            if (event.type === "message.completed") {
              appendChatMessage("assistant", event.data.text, event.data.message_id);
            }
            if (run.id === runId) {
              focusLastSeq = Math.max(focusLastSeq, event.seq);
            }
          }
        }
        lastEventSeq = focusLastSeq;
      } catch (error) {
        container.textContent = error.message;
      }
    }

    async function listFiles() {
      if (!currentSession) return;
      try {
        const page = await api(`/v1/sessions/${currentSession.id}/files`);
        const container = $("file-list");
        container.textContent = "";
        if (!page.items.length) {
          container.textContent = "尚无文件";
          return;
        }
        for (const file of page.items) {
          const row = document.createElement("div");
          row.className = "file";
          const name = document.createElement("span");
          name.textContent = file.path;
          const meta = document.createElement("span");
          meta.textContent = `${file.size_bytes} B`;
          row.append(name, meta);
          container.append(row);
        }
      } catch (error) {
        $("file-list").textContent = error.message;
      }
    }

    $("refresh-health").addEventListener("click", refreshHealth);
    $("create-session").addEventListener("click", createSession);
    $("submit-run").addEventListener("click", submitRun);
    $("cancel-run").addEventListener("click", cancelRun);
    $("list-files").addEventListener("click", listFiles);

    refreshHealth();
    loadSkills();
    loadSessions();
  </script>
</body>
</html>
