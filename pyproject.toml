[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "code-forge-core"
version = "0.1.0"
description = "Architecture contracts and domain core for Code Forge Agent Runtime"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
